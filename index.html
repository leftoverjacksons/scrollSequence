<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Sequences</title>
<style>
  :root {
    --bg: #ffffff; --card: #f6f6f5; --fg: #1f2023; --muted: #5f6267;
    --accent: #ff671f; --border: rgba(31, 32, 35, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181c; --card: #202126; --fg: #f2f0ea; --muted: #a3a6ab; --accent: #ff7a3d; --border: rgba(242, 240, 234, .1); }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 64px 16px 80px; }
  header small { color: var(--accent); letter-spacing: .15em; text-transform: uppercase; font-size: .75rem; font-weight: 600; }
  h1 { font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.03em; font-weight: 700; margin-top: .25rem; }
  header p { color: var(--muted); margin-top: .5rem; max-width: 36rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; margin-top: 40px; }
  .card {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0, 0, 0, .08); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .poster { aspect-ratio: 16 / 9; background: #fff; display: grid; place-items: center; overflow: hidden; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .empty { color: #9a9ca0; font-size: .85rem; }
  .meta { padding: 16px 18px 18px; }
  .meta h2 { font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .meta p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .badge { font-size: .65rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); }
  .badge.live { color: var(--accent); border-color: currentColor; }
  .links { display: flex; gap: 14px; margin-top: 12px; font-size: .8rem; }
  .links span { color: var(--muted); }
  .error { color: var(--muted); margin-top: 40px; }
</style>
</head>
<body>
<main>
  <header>
    <small>Exploded views</small>
    <h1>Scroll sequences</h1>
    <p>Blender-rendered explode and reassemble animations, scrubbed as you scroll. Pick a product.</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script>
  // The product list lives in products.json, so adding a product never touches this page.
  const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  fetch("products.json", { cache: "no-cache" }).then(r => r.json()).then(list => {
    document.getElementById("grid").innerHTML = list.map(p => {
      const href = `products/${encodeURIComponent(p.slug)}/`;
      const poster = p.poster
        ? `<img src="${href}${esc(p.poster)}" alt="" loading="lazy">`
        : `<span class="empty">No frames yet</span>`;
      return `<a class="card" href="${href}">
        <div class="poster">${poster}</div>
        <div class="meta">
          <h2>${esc(p.name)} <span class="badge ${p.status === "live" ? "live" : ""}">${esc(p.status || "draft")}</span></h2>
          <p>${esc(p.tagline)}</p>
          ${p.updated ? `<div class="links"><span>Updated ${esc(p.updated)}</span></div>` : ""}
        </div>
      </a>`;
    }).join("");
  }).catch(() => {
    document.getElementById("grid").outerHTML = `<p class="error">Couldn't load products.json. Serve this folder over HTTP (python -m http.server).</p>`;
  });
</script>
</body>
</html>
